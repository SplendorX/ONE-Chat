<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" fill="none">
  <!--
    Wordmark: logo mark + "ONE" in gold + "Chat" in cream/oat.
    Tighter spacing between ONE and Chat.
  -->

  <!-- Logo mark (scaled down, ~72px tall in a 100px tall canvas) -->
  <!-- Scaled to fit ~72×72 in the left of the canvas, vertically centered -->
  <g transform="translate(4, 14) scale(0.36)">
    <!-- Open circle ring -->
    <path
      d="M 62 140 A 58 58 0 1 1 137 51"
      stroke="#C4A265" stroke-width="15" stroke-linecap="round" fill="none"
    />
    <!-- Bubble + cutouts -->
    <g fill-rule="evenodd" fill="#C4A265">
      <path d="M100 40 C71 40,48 62,48 88 C48 112,64 131,87 138 L60 163 L90 146 C93 147,96 148,100 148 C129 148,152 126,152 100 C152 68,129 40,100 40 Z"/>
      <rect x="79" y="67" width="18" height="62" rx="4"/>
      <path d="M65 84 Q73 68,84 63 L88 72 Q80 76,76 89 Z"/>
      <circle cx="116" cy="98" r="6"/>
      <circle cx="132" cy="98" r="6"/>
      <circle cx="148" cy="98" r="6"/>
    </g>
  </g>

  <!-- "ONE" in bold gold — x starts right after the icon (~72px wide + 10px gap = 82) -->
  <text
    x="82" y="73"
    font-family="'Space Grotesk', 'Arial Black', sans-serif"
    font-size="68"
    font-weight="800"
    fill="#C4A265"
    letter-spacing="-2"
  >ONE</text>

  <!-- "Chat" in cream — positioned tight after "ONE" (ONE ~3 chars * ~38px = ~196px wide + 82 start = 278, minus kerning) -->
  <text
    x="272" y="73"
    font-family="'Space Grotesk', 'Arial Black', sans-serif"
    font-size="68"
    font-weight="800"
    fill="#EDE5D8"
    letter-spacing="-2"
  >Chat</text>
</svg>
