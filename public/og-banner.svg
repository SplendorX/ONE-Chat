<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Full background gradient: deep dark warm → near-black -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1510"/>
      <stop offset="55%" stop-color="#14100B"/>
      <stop offset="100%" stop-color="#0E0A07"/>
    </linearGradient>

    <!-- Ambient gold glow behind logo -->
    <radialGradient id="logo-glow" cx="22%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#C4A265" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C4A265" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle right-side glow for depth -->
    <radialGradient id="right-glow" cx="82%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#A07840" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A07840" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold ring gradient -->
    <linearGradient id="ring-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C87A"/>
      <stop offset="45%" stop-color="#C4A265"/>
      <stop offset="100%" stop-color="#8C6E3F"/>
    </linearGradient>

    <!-- Bubble fill gradient -->
    <linearGradient id="bubble-g" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#D4B278"/>
      <stop offset="100%" stop-color="#B8924F"/>
    </linearGradient>

    <!-- Logo mask -->
    <mask id="lm">
      <rect width="1200" height="630" fill="white"/>
      <!-- "1" stroke -->
      <path d="M 107 221 C 101 223 96 229 95 236 L 101 238 C 102 234 104 231 108 229 Z" fill="black"/>
      <rect x="103" y="228" width="11" height="52" rx="3" fill="black"/>
      <!-- Three dots -->
      <circle cx="136" cy="300" r="5.5" fill="black"/>
      <circle cx="151" cy="300" r="5.5" fill="black"/>
      <circle cx="166" cy="300" r="5.5" fill="black"/>
    </mask>

    <!-- Thin gold divider gradient -->
    <linearGradient id="divider-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4A265" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C4A265" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#C4A265" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4A265" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle noise/grain filter for premium texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Bubble drop shadow -->
    <filter id="bshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Ring glow -->
    <filter id="rglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>

    <!-- Text shadow for tagline -->
    <filter id="tshadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="630" fill="url(#logo-glow)"/>
  <rect width="1200" height="630" fill="url(#right-glow)"/>

  <!-- Subtle grain texture overlay -->
  <rect width="1200" height="630" fill="transparent" filter="url(#grain)" opacity="0.03"/>

  <!-- ── LOGO MARK (centered left column) ── -->
  <!-- Ring arc (open gap bottom-right), glow layer -->
  <g filter="url(#rglow)">
    <path d="M 75 390 A 195 195 0 1 1 420 75"
      stroke="url(#ring-g)" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>
  <!-- Ring arc main -->
  <path d="M 75 390 A 195 195 0 1 1 420 75"
    stroke="url(#ring-g)" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Speech bubble (logo) -->
  <path
    d="M 247 155
       C 165 155, 103 212, 103 278
       C 103 334, 138 380, 189 396
       L 148 438
       L 196 411
       C 212 415, 229 417, 247 417
       C 329 417, 391 360, 391 294
       C 391 216, 326 155, 247 155 Z"
    fill="url(#bubble-g)"
    mask="url(#lm)"
    filter="url(#bshadow)"
  />

  <!-- ── VERTICAL GOLD DIVIDER ── -->
  <rect x="488" y="165" width="1.5" height="300" fill="url(#divider-g)"/>

  <!-- ── RIGHT COLUMN: Wordmark + tagline + pills ── -->

  <!-- "ONE" wordmark -->
  <text
    x="542"
    y="306"
    font-family="'Space Grotesk', 'DM Sans', sans-serif"
    font-weight="700"
    font-size="128"
    letter-spacing="-3"
    fill="#C4A265"
  >ONE</text>

  <!-- "Chat" wordmark -->
  <text
    x="834"
    y="306"
    font-family="'Space Grotesk', 'DM Sans', sans-serif"
    font-weight="600"
    font-size="128"
    letter-spacing="-3"
    fill="#F5EDD8"
    opacity="0.92"
  >Chat</text>

  <!-- Tagline -->
  <text
    x="542"
    y="360"
    font-family="'DM Sans', sans-serif"
    font-weight="400"
    font-size="30"
    letter-spacing="0.2"
    fill="#9C8B72"
    filter="url(#tshadow)"
  >Your conversations can do more.</text>

  <!-- Feature pills -->
  <!-- Pill 1: Send USDC -->
  <rect x="542" y="402" width="148" height="38" rx="19" fill="#2A2318" stroke="#C4A265" stroke-width="1" stroke-opacity="0.5"/>
  <text x="616" y="426" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" fill="#C4A265" text-anchor="middle">Send USDC</text>

  <!-- Pill 2: Split bills -->
  <rect x="702" y="402" width="138" height="38" rx="19" fill="#2A2318" stroke="#9C8B72" stroke-width="1" stroke-opacity="0.4"/>
  <text x="771" y="426" font-family="'DM Sans', sans-serif" font-size="15" font-weight="500" fill="#9C8B72" text-anchor="middle">Split bills</text>

  <!-- Pill 3: ALLIE AI -->
  <rect x="852" y="402" width="124" height="38" rx="19" fill="#2A2318" stroke="#9C8B72" stroke-width="1" stroke-opacity="0.4"/>
  <text x="914" y="426" font-family="'DM Sans', sans-serif" font-size="15" font-weight="500" fill="#9C8B72" text-anchor="middle">ALLIE AI</text>

  <!-- Pill 4: Save together -->
  <rect x="542" y="454" width="172" height="38" rx="19" fill="#2A2318" stroke="#9C8B72" stroke-width="1" stroke-opacity="0.4"/>
  <text x="628" y="478" font-family="'DM Sans', sans-serif" font-size="15" font-weight="500" fill="#9C8B72" text-anchor="middle">Save together</text>

  <!-- Pill 5: Group chats -->
  <rect x="726" y="454" width="150" height="38" rx="19" fill="#2A2318" stroke="#9C8B72" stroke-width="1" stroke-opacity="0.4"/>
  <text x="801" y="478" font-family="'DM Sans', sans-serif" font-size="15" font-weight="500" fill="#9C8B72" text-anchor="middle">Group chats</text>

  <!-- Bottom URL / branding line -->
  <text
    x="542"
    y="566"
    font-family="'DM Sans', sans-serif"
    font-size="20"
    font-weight="500"
    fill="#5A4E3E"
    letter-spacing="0.5"
  >one-chat-orpin.vercel.app</text>

  <!-- Subtle bottom border glow -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#ring-g)" opacity="0.15" rx="0"/>
</svg>
