<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial gradient: warm gold center → deep gold edge -->
    <radialGradient id="bg-grad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#2A2318"/>
      <stop offset="100%" stop-color="#16110C"/>
    </radialGradient>

    <!-- Gold shimmer gradient for the ring arc -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C87A"/>
      <stop offset="40%" stop-color="#C4A265"/>
      <stop offset="100%" stop-color="#8C6E3F"/>
    </linearGradient>

    <!-- Bubble fill gradient -->
    <linearGradient id="bubble-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#D4B278"/>
      <stop offset="100%" stop-color="#B8924F"/>
    </linearGradient>

    <!-- Subtle inner glow on the background disc -->
    <radialGradient id="disc-glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#3D2F1A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#16110C" stop-opacity="1"/>
    </radialGradient>

    <!-- Mask to cut numerals out of the bubble -->
    <mask id="bubble-mask">
      <rect width="512" height="512" fill="white"/>
      <!-- "1" numeral: diagonal top-flag stroke + vertical stem -->
      <path d="M 212 118 C 196 124 183 137 180 156 L 200 161 C 202 151 210 143 220 139 Z" fill="black"/>
      <rect x="205" y="136" width="30" height="138" rx="8" fill="black"/>
      <!-- Three activity dots — slightly larger, better spaced -->
      <circle cx="295" cy="248" r="14" fill="black"/>
      <circle cx="335" cy="248" r="14" fill="black"/>
      <circle cx="375" cy="248" r="14" fill="black"/>
    </mask>

    <!-- Drop shadow filter for the bubble -->
    <filter id="bubble-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Soft glow behind the ring -->
    <filter id="ring-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark rounded-square background -->
  <rect width="512" height="512" rx="108" fill="url(#disc-glow)"/>

  <!-- Subtle inner highlight rim -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#3A2D1C" stroke-width="2"/>

  <!-- Outer decorative arc ring: open gap at bottom-right, rendered with glow -->
  <g filter="url(#ring-glow)">
    <path
      d="M 126 374 A 176 176 0 1 1 386 126"
      stroke="url(#ring-grad)"
      stroke-width="28"
      stroke-linecap="round"
      fill="none"
      opacity="0.55"
    />
  </g>

  <!-- Main gold arc ring: open gap at bottom-right -->
  <path
    d="M 126 374 A 176 176 0 1 1 386 126"
    stroke="url(#ring-grad)"
    stroke-width="22"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Speech bubble body with numeral+dots cut out -->
  <path
    d="M 256 92
       C 172 92, 108 154, 108 228
       C 108 291, 148 342, 206 362
       L 156 420
       L 210 388
       C 224 392, 240 394, 256 394
       C 340 394, 404 332, 404 258
       C 404 166, 337 92, 256 92 Z"
    fill="url(#bubble-grad)"
    mask="url(#bubble-mask)"
    filter="url(#bubble-shadow)"
  />
</svg>
